name: pytest

# TODO(STUDENT): desafio 7 — adicione um filtro paths aos triggers push e pull_request.
# Não remova os triggers que já existem. O objetivo está no TESTING_GUIDE.md.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest
